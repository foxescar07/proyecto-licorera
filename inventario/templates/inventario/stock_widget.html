{% load static %}

<div id="stock-widget" class="mb-4 p-3 rounded-3" style="background:#152d50; border:1px solid rgba(77,168,218,0.35);">

  <div class="d-flex align-items-center gap-3">
    <div id="sw-icono" style="font-size:1.3rem; flex-shrink:0;"></div>
    <div style="flex:1; min-width:0;">
      <div id="sw-label" style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:rgba(226,232,240,0.45);">Estado del inventario</div>
      <div id="sw-titulo" class="fw-bold" style="font-size:0.9rem;"></div>
    </div>
    <button id="sw-btn-toggle" class="btn btn-sm rounded-pill d-none"
            style="font-size:0.75rem; font-weight:700; white-space:nowrap;"
            onclick="swToggle()">
      Ver alertas ▾
    </button>
  </div>

  <div id="sw-panel" class="d-none mt-3 pt-3" style="border-top:1px solid rgba(77,168,218,0.15);">
    <div id="sw-grid" class="row g-2"></div>
  </div>

</div>

<script>
(function () {
  const INTERVALO = 8000;
  let abierto = false;

  window.swToggle = function () {
    abierto = !abierto;
    document.getElementById('sw-panel').classList.toggle('d-none', !abierto);
    document.getElementById('sw-btn-toggle').textContent = abierto ? 'Ocultar ▴' : 'Ver alertas ▾';
  };

  function colorClase(nivel) {
    return nivel === 'critico'
      ? { bg: 'rgba(255,107,107,.10)', borde: 'rgba(255,107,107,.35)', color: '#fa8787', label: 'Crítico' }
      : { bg: 'rgba(243,156,18,.12)', borde: 'rgba(243,156,18,.3)', color: '#f39c12', label: 'Bajo' };
  }

  function renderProductos(criticos, bajos) {
    const grid = document.getElementById('sw-grid');
    const todos = [
      ...(criticos || []).map(p => ({ ...p, nivel: 'critico' })),
      ...(bajos    || []).map(p => ({ ...p, nivel: 'bajo' })),
    ];

    grid.innerHTML = todos.map(p => {
      const c = colorClase(p.nivel);
      return `
        <div class="col-sm-6">
          <div class="p-2 rounded-3 h-100" style="background:${c.bg}; border:1px solid ${c.borde};">
            <div style="font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:rgba(226,232,240,.45);">${c.label}</div>
            <div class="fw-bold text-white mt-1" style="font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.nombre}</div>
            <div class="fw-bold mt-1" style="font-size:1.3rem; color:${c.color}; line-height:1;">${p.cantidad} uds</div>
            <div class="d-flex gap-1 mt-2">
              <a href="${p.url_presentacion}" class="btn btn-sm rounded-pill flex-fill"
                 style="font-size:0.72rem; font-weight:700; background:rgba(77,168,218,.18); color:#4DA8DA; border:1px solid rgba(77,168,218,.3);">
                Ver producto
              </a>
              <a href="${p.url_lote}" class="btn btn-sm rounded-pill flex-fill"
                 style="font-size:0.72rem; font-weight:700; background:rgba(39,174,96,.18); color:#27ae60; border:1px solid rgba(39,174,96,.3);">
                + Lote
              </a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function pintar(data) {
    const icono  = document.getElementById('sw-icono');
    const titulo = document.getElementById('sw-titulo');
    const btn    = document.getElementById('sw-btn-toggle');

    if (data.estado === 'verde') {
      icono.innerHTML  = '<i class="bi bi-check-circle-fill text-success"></i>';
      titulo.style.color = '#27ae60';
      titulo.textContent = 'Todo en orden — stock suficiente';
      btn.classList.add('d-none');
      document.getElementById('sw-panel').classList.add('d-none');
    } else {
      const esCritico = data.estado === 'rojo';
      icono.innerHTML  = `<i class="bi bi-exclamation-triangle-fill" style="color:${esCritico ? '#e74c3c' : '#f39c12'}"></i>`;
      titulo.style.color = esCritico ? '#e74c3c' : '#f39c12';
      titulo.textContent = `${esCritico ? '¡Stock crítico!' : 'Stock bajo'} — ${data.total_alertas} producto${data.total_alertas !== 1 ? 's' : ''}`;
      btn.classList.remove('d-none');
      btn.style.background = esCritico ? 'rgba(231,76,60,.2)'  : 'rgba(243,156,18,.2)';
      btn.style.color      = esCritico ? '#e74c3c' : '#f39c12';
      btn.style.border     = esCritico ? '1px solid rgba(231,76,60,.4)' : '1px solid rgba(243,156,18,.4)';
      renderProductos(data.criticos, data.bajos);
    }
  }

  function actualizar() {
    fetch("{% url 'stock_status' %}?_=" + Date.now(), {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => pintar(data))
      .catch(() => {});
  }

  actualizar();
  setInterval(actualizar, INTERVALO);
})();
</script>
