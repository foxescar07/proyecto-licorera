{% load static %}
<link rel="stylesheet" href="{% static 'css/widget.css' %}">

<div id="stock-widget" class="mb-4 p-3 rounded-3 sw-container">

  <div class="d-flex align-items-center gap-3">
    <div id="sw-icono" class="sw-icono-wrap"></div>
    <div class="flex-grow-1">
      <div class="text-uppercase fw-bold mb-1 sw-label-superior">Estado del inventario</div>
      <div id="sw-titulo" class="fw-bold sw-titulo"></div>
    </div>
    <button id="sw-btn-toggle" class="btn btn-sm rounded-pill d-none fw-bold sw-btn-toggle"
            onclick="swToggle()">
      Ver alertas ▾
    </button>
  </div>

  <div id="sw-panel" class="d-none mt-3 pt-3 sw-panel">
    <div id="sw-grid" class="row g-2"></div>
  </div>

</div>

<script>
(function () {
  const INTERVALO = 8000;
  let abierto = false;

  window.swToggle = function () {
    abierto = !abierto;
    document.getElementById('sw-panel').classList.toggle('d-none', !abierto);
    document.getElementById('sw-btn-toggle').textContent = abierto ? 'Ocultar ▴' : 'Ver alertas ▾';
  };

  function colorClase(nivel) {
    return nivel === 'critico'
      ? { borde: '#9b5de5', color: '#9b5de5', colorLabel: '#b87eef', label: 'Crítico' }
      : { borde: '#4DA8DA', color: '#4DA8DA', colorLabel: '#6dbfe8', label: 'Bajo' };
  }

  function renderProductos(criticos, bajos) {
    const grid = document.getElementById('sw-grid');
    const todos = [
      ...(criticos || []).map(p => ({ ...p, nivel: 'critico' })),
      ...(bajos    || []).map(p => ({ ...p, nivel: 'bajo' })),
    ];

    grid.innerHTML = todos.map(p => {
      const c = colorClase(p.nivel);
      return `
        <div class="col-sm-6">
          <div class="p-2 rounded-3 h-100" style="background:#0f1e30; border-left:3px solid ${c.borde}; border-top:1px solid rgba(255,255,255,.04); border-right:1px solid rgba(255,255,255,.04); border-bottom:1px solid rgba(255,255,255,.04);">
            <div class="text-uppercase fw-bold mb-1" style="font-size:9px; letter-spacing:.05em; color:${c.colorLabel};">${c.label}</div>
            <div class="fw-bold text-white" style="font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.nombre}</div>
            <div class="fw-bold mt-1" style="font-size:1.3rem; color:${c.color}; line-height:1;">${p.cantidad} uds</div>
            <div class="d-flex gap-1 mt-2">
              <a href="${p.url_presentacion}" class="btn btn-sm rounded-pill flex-fill fw-bold"
                 style="font-size:0.72rem; background:rgba(77,168,218,.1); color:#4DA8DA; border:1px solid rgba(77,168,218,.2);">
                Ver producto
              </a>
              <a href="${p.url_lote}" class="btn btn-sm rounded-pill flex-fill fw-bold"
                 style="font-size:0.72rem; background:rgba(39,174,96,.08); color:#4caf7a; border:1px solid rgba(39,174,96,.2);">
                + Lote
              </a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function pintar(data) {
    const icono  = document.getElementById('sw-icono');
    const titulo = document.getElementById('sw-titulo');
    const btn    = document.getElementById('sw-btn-toggle');

    if (data.estado === 'verde') {
      icono.innerHTML  = '<i class="bi bi-check-circle-fill text-success"></i>';
      titulo.style.color = '#27ae60';
      titulo.textContent = 'Todo en orden — stock suficiente';
      btn.classList.add('d-none');
      document.getElementById('sw-panel').classList.add('d-none');
    } else {
      const esCritico = data.estado === 'rojo';
      icono.innerHTML  = `<i class="bi bi-exclamation-triangle-fill" style="color:${esCritico ? '#9b5de5' : '#4DA8DA'}"></i>`;
      titulo.style.color = esCritico ? '#9b5de5' : '#4DA8DA';
      titulo.textContent = `${esCritico ? '¡Stock crítico!' : 'Stock bajo'} — ${data.total_alertas} producto${data.total_alertas !== 1 ? 's' : ''}`;
      btn.classList.remove('d-none');
      renderProductos(data.criticos, data.bajos);
    }
  }

  function actualizar() {
    fetch("{% url 'stock_status' %}?_=" + Date.now(), {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => pintar(data))
      .catch(() => {});
  }

  actualizar();
  setInterval(actualizar, INTERVALO);
})();
</script>
