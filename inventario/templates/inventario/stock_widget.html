{% load static %}
<link rel="stylesheet" href="{% static 'css/widget.css' %}">

<div id="stock-widget"
     data-url="{% url 'productos:stock_status' %}"
     class="mb-4 p-3 rounded-3 sw-container">

  <div class="d-flex align-items-center gap-3">
    <div id="sw-icono" class="sw-icono-wrap"></div>
    <div class="flex-grow-1">
      <div class="text-uppercase fw-bold mb-1 sw-label-superior">Estado del inventario</div>
      <div id="sw-titulo" class="fw-bold sw-titulo"></div>
    </div>
    <button id="sw-btn-toggle" class="btn btn-sm rounded-pill d-none fw-bold sw-btn-toggle"
            onclick="swToggle()">
      Ver alertas ▾
    </button>
  </div>

  <div id="sw-panel" class="d-none mt-3 pt-3 sw-panel">
    <div id="sw-grid" class="row g-2"></div>
  </div>

</div>

<script src="{% static 'js/inventario/stock_widget.js' %}"></script>
