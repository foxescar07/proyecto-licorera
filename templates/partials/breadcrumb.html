<nav class="cys-breadcrumb mb-4" aria-label="breadcrumb">
  <a href="{% url 'principal' %}" class="cys-breadcrumb__link">
    <i class="bi bi-house-door-fill"></i> Tablero
  </a>

  {% for item in breadcrumb_items %}
    <span class="cys-breadcrumb__sep"><i class="bi bi-chevron-right"></i></span>

    {% if forloop.last %}
      <span class="cys-breadcrumb__current">{{ item.nombre }}</span>
    {% else %}
      <a href="{{ item.url }}" class="cys-breadcrumb__link">{{ item.nombre }}</a>
    {% endif %}
  {% endfor %}
</nav>
