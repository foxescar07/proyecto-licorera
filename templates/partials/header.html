{% load static %}
<header class="cys-header" data-url-stock-status="{% url 'stock_status' %}">
    <div class="cys-header__brand">
        <img src="{% static 'img/logo.jpeg' %}" alt="Logo CYS" class="cys-header__logo">
        <div>
            <div class="cys-header__title">Tablero de Control</div>
            <div class="cys-header__sub">
                <span>Licorera C Y S</span>
                <span class="cys-dot"></span>
            </div>
        </div>
    </div>

    <div class="d-flex align-items-center gap-4">

        <div class="cys-header__clock">
            <div id="reloj" class="cys-header__clock-time">00:00</div>
            <div id="fecha" class="cys-header__clock-date">Cargando fecha...</div>
        </div>

        <div style="width:1px; height:32px; background:rgba(226,232,240,.15);"></div>

        <div class="dropdown">
            <button id="notif-bell-btn" class="btn p-0 position-relative"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    aria-label="Notificaciones"
                    style="background:transparent; border:none; color:rgba(226,232,240,.85); line-height:1;">
                <i id="notif-bell-icon" class="bi bi-bell" style="font-size:1.6rem;"></i>
                <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill d-none"
                      style="background:#4DA8DA; font-size:10px; min-width:18px; padding:3px 6px;
                             border:2px solid var(--azul-oscuro);">0</span>
            </button>

            <div class="dropdown-menu dropdown-menu-end p-0"
                style="border:1px solid rgba(77,168,218,.25); width:290px; border-radius:10px; overflow:hidden;
                        background:#0d1f35; color:#e2e8f0;">

                <div class="d-flex" style="border-bottom:1px solid rgba(255,255,255,.06);">
                    <button id="tab-alertas" type="button" onclick="notifTab('alertas')"
                            class="btn btn-sm flex-fill rounded-0 fw-bold"
                            style="font-size:11px; color:#4DA8DA; border-bottom:2px solid #4DA8DA;">
                        Alertas
                    </button>
                    <button id="tab-historial" type="button" onclick="notifTab('historial')"
                            class="btn btn-sm flex-fill rounded-0 fw-bold"
                            style="font-size:11px; color:rgba(226,232,240,.4); border-bottom:2px solid transparent;">
                        Historial
                    </button>
                </div>

                <div id="panel-alertas" style="max-height:320px; overflow-y:auto;">
                    <div class="text-center py-3" style="font-size:12px; color:rgba(226,232,240,.4);">Cargando…</div>
                </div>

                <div id="panel-historial" class="d-none" style="max-height:320px; overflow-y:auto;">
                    <div class="text-center py-3" style="font-size:12px; color:rgba(226,232,240,.4);">Sin notificaciones aún</div>
                </div>

                <a class="dropdown-item text-center py-2" href="{% url 'gestion_stock' %}"
                   style="font-size:12px; color:#4DA8DA; border-top:1px solid rgba(255,255,255,.06);">
                    Ver stock completo →
                </a>
            </div>
        </div>

    </div>
</header>

<script src="{% static 'js/cuerpo/header.js' %}" defer></script>
