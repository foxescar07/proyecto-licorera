{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}CYS Ltda{% endblock %}</title>

    <link rel="icon" type="image/jpeg" href="{% static 'img/logo.jpeg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'css/cuerpo/base.css' %}">

    <style>
        body.modal-open,
body.offcanvas-open {
  overflow: auto !important;
  padding-right: 0 !important;
  margin-right: 0 !important;
}

        #notif-dropdown-menu {
            background: #0d1b2a !important;
        }
        #notif-dropdown-menu .notif-item:hover,
        #notif-dropdown-menu .notif-item:focus,
        #notif-dropdown-menu .dropdown-item:hover,
        #notif-dropdown-menu .dropdown-item:focus {
            background: rgba(77, 168, 218, 0.08) !important;
            color: #e2e8f0 !important;
        }
        #notif-dropdown-menu .notif-footer:hover,
        #notif-dropdown-menu .notif-footer:focus {
            background: rgba(77, 168, 218, 0.12) !important;
            color: #4DA8DA !important;
        }
    </style>

    {% block extra_css %}{% endblock %}

    <script>
        (function () {
            const cfg = JSON.parse(localStorage.getItem('cys_config') || '{}');
            const root = document.documentElement;
            const temas = {
                oscuro: {
                    '--fondo':'#011936','--fondo-card':'#0a2240','--fondo-card2':'#0d2a4d',
                    '--texto':'#e2e8f0','--texto-muted':'#7a9bbf','--azul-claro':'#4DA8DA',
                    '--azul-borde':'rgba(77,168,218,.2)','--azul-oscuro':'#05244a',
                    '--verde':'#2ecc71','--rojo':'#c0392b','--blanco':'#e8edf2','--gris-claro':'#8899aa',
                },
                claro: {
                    '--fondo':'#f0f4f8','--fondo-card':'#ffffff','--fondo-card2':'#e8eef5',
                    '--texto':'#1a2a3a','--texto-muted':'#4a6a8a','--azul-claro':'#B22A1A',
                    '--azul-borde':'rgba(178,42,26,.18)','--azul-oscuro':'#ddeaf5',
                    '--verde':'#1a8a4a','--rojo':'#B22A1A','--blanco':'#1a2a3a','--gris-claro':'#3a5a7a',
                },
                'alto-contraste': {
                    '--fondo':'#000000','--fondo-card':'#0a0a0a','--fondo-card2':'#111111',
                    '--texto':'#ffffff','--texto-muted':'#cccccc','--azul-claro':'#00cfff',
                    '--azul-borde':'rgba(0,207,255,.4)','--azul-oscuro':'#001a22',
                    '--verde':'#00ff88','--rojo':'#ff4444','--blanco':'#ffffff','--gris-claro':'#aaaaaa',
                },
                sepia: {
                    '--fondo':'#1a0f05','--fondo-card':'#2c1f0e','--fondo-card2':'#3d2b14',
                    '--texto':'#f5e6c8','--texto-muted':'#a08060','--azul-claro':'#d4a060',
                    '--azul-borde':'rgba(212,160,96,.25)','--azul-oscuro':'#150c04',
                    '--verde':'#7ab870','--rojo':'#c05030','--blanco':'#f5e6c8','--gris-claro':'#907060',
                },
            };
            const densidades = {
                compacto: {'--card-padding':'.75rem','--gap-base':'.4rem','--font-base':'.8rem'},
                normal:   {'--card-padding':'1.25rem','--gap-base':'.75rem','--font-base':'.875rem'},
                relajado: {'--card-padding':'1.75rem','--gap-base':'1.1rem','--font-base':'.95rem'},
            };
            const tema     = temas[cfg.tema]          || temas.oscuro;
            const densidad = densidades[cfg.densidad] || densidades.normal;
            Object.entries({...tema,...densidad}).forEach(([k,v]) => root.style.setProperty(k,v));
        })();
    </script>
</head>

<body>
<div id="cys-layout">
    {% include 'partials/header.html' %}

    <nav class="cys-subnav">
        <span class="cys-subnav__page">{% block page_title %}Tablero{% endblock %}</span>
        <div class="d-flex align-items-center gap-2">
            <button class="cys-menu-btn" id="menuBtn">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </nav>

    {% include 'partials/aside.html' %}

    <main class="cys-main">
        {% block content %}{% endblock %}
    </main>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.x/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/reloj.js' %}"></script>
    <script src="{% static 'js/principal.js' %}"></script>

    <script>
        // ── SIDEBAR ──
        const sidebarEl = document.getElementById('sidebarRight');
        if (sidebarEl) {
            const bsSidebar = new bootstrap.Offcanvas(sidebarEl, {
                scroll: true,
                backdrop: false
            });
            const menuBtn = document.getElementById('menuBtn');

            // Abrir automáticamente según preferencia de Configuración (cys_config.sidebarAuto)
            let cysCfg = {};
            try { cysCfg = JSON.parse(localStorage.getItem('cys_config') || '{}'); } catch (e) {}
            if (cysCfg.sidebarAuto === true) {
            sidebarEl.classList.add('show');
            document.body.classList.add('sidebar-open');
            sidebarEl.style.visibility = 'visible'; 
            }

            menuBtn?.addEventListener('click', () => bsSidebar.toggle());

            // En cada evento limpiar lo que Bootstrap intenta poner
            function limpiarBootstrap() {
                document.body.style.removeProperty('padding-right');
                document.body.style.removeProperty('overflow');
            }

            sidebarEl.addEventListener('show.bs.offcanvas', () => {
                document.body.classList.add('sidebar-open');
                limpiarBootstrap();
            });
            sidebarEl.addEventListener('shown.bs.offcanvas', limpiarBootstrap);
            sidebarEl.addEventListener('hide.bs.offcanvas',  limpiarBootstrap);
            sidebarEl.addEventListener('hidden.bs.offcanvas', () => {
                document.body.classList.remove('sidebar-open');
                limpiarBootstrap();
            });
        }

        // ── SUBMENÚS ──
        function toggleSubmenu(e, btn, submenuId) {
            e.preventDefault();
            const s = document.getElementById(submenuId);
            if (!s) return;
            s.classList.toggle('abierto');
            btn.classList.toggle('abierto');
            btn.querySelector('.cys-chevron')?.classList.toggle('abierto');
        }

        // ── ABRIR SUBMENÚ SEGÚN RUTA ──
        document.addEventListener('DOMContentLoaded', function () {
            const path = window.location.pathname;
            function abrir(sid, bid) {
                document.getElementById(sid)?.classList.add('abierto');
                document.getElementById(bid)?.classList.add('abierto');
            }
            if (path.startsWith('/ventas/'))     abrir('submenuVentas',      'btnVentas');
            if (path.startsWith('/proveedores/') ||
                path.startsWith('/compra/'))      abrir('submenuProveedores', 'btnProveedores');
            if (path.startsWith('/productos/'))  abrir('submenuProductos',   'btnProductos');
            if (path.startsWith('/inventario/')) abrir('submenuInventario',  'btnInventario');
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
