{% load static %}

<div id="stock-widget" class="card prod-card mb-4 p-3">
  <div class="d-flex align-items-center gap-3">
    <div id="sw-icono" style="font-size:1.4rem; flex-shrink:0;"></div>
    <div style="flex:1; min-width:0;">
      <div id="sw-titulo" class="fw-bold small text-uppercase"></div>
      <div id="sw-subtitulo" class="text-muted small text-truncate"></div>
    </div>
    <span id="sw-badge" class="badge ms-auto"></span>
  </div>
</div>

<script>
(function () {
  const INTERVALO = 8000;

  function pintar(data) {
    const widget   = document.getElementById('stock-widget');
    const swIcono  = document.getElementById('sw-icono');
    const swTitulo = document.getElementById('sw-titulo');
    const swSub    = document.getElementById('sw-subtitulo');
    const swBadge  = document.getElementById('sw-badge');

    if (data.estado === 'verde') {
      widget.style.borderColor = 'rgba(39,174,96,.35)';
      swIcono.innerHTML  = '<i class="bi bi-check-circle-fill text-success"></i>';
      swTitulo.textContent = 'Stock en Estado Normal';
      swTitulo.className   = 'fw-bold small text-uppercase text-success';
      swSub.textContent    = 'Todos los productos tienen stock suficiente.';
      swBadge.className    = 'badge bg-success ms-auto';
      swBadge.textContent  = 'Todo en orden ✓';
    } else {
      const esCritico = data.estado === 'rojo';
      widget.style.borderColor = esCritico ? 'rgba(192,57,43,.4)' : 'rgba(241,196,15,.4)';
      swIcono.innerHTML  = `<i class="bi bi-exclamation-triangle-fill ${esCritico ? 'text-danger' : 'text-warning'}"></i>`;
      swTitulo.textContent = esCritico ? '¡Atención — Stock Crítico!' : 'Stock Bajo';
      swTitulo.className   = `fw-bold small text-uppercase ${esCritico ? 'text-danger' : 'text-warning'}`;
      swBadge.className    = `badge ms-auto ${esCritico ? 'bg-danger' : 'bg-warning text-dark'}`;
      swBadge.textContent  = `${data.total_alertas} producto${data.total_alertas !== 1 ? 's' : ''} con alerta`;

      const todos = [
        ...(data.criticos || []).map(p => ({ ...p, nivel: 'critico' })),
        ...(data.bajos    || []).map(p => ({ ...p, nivel: 'bajo'    })),
      ];
      if (todos.length) {
        swSub.innerHTML = todos.map(p =>
          `<span class="${p.nivel === 'critico' ? 'text-danger' : 'text-warning'} me-3">
            <strong>${p.nombre}</strong>: ${p.cantidad} uds
          </span>`
        ).join('');
      }
    }
  }

  function actualizar() {
    fetch("{% url 'stock_status' %}?_=" + Date.now(), {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => pintar(data))
      .catch(() => {});
  }

  actualizar();
  setInterval(actualizar, INTERVALO);
})();
</script>
